# THE PHONE RELAY ON CLOUDFLARE (relay/worker.mjs). Deploy with
# `npm run relay:deploy` from the repository's root, after `npx wrangler login`
# in relay/ once. Try it on this computer with `npm run relay:dev`.
name = "agentbox-relay"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

# One room per Mac, as a Durable Object: it holds the Mac's socket and passes
# sealed bytes between it and that Mac's phones. SQLite-backed, which is the
# kind the free plan offers.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# No request logs are kept. They would hold nothing readable, but there is no
# reason to keep even the room names and the times.
[observability]
enabled = false
